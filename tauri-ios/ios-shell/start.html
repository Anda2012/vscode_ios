<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VScode</title>
<body style="margin:0;background:#1e1e1e;color:#ccc;font:16px -apple-system,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center">
<div style="font-size:30px;margin-bottom:12px">VScode</div>
<div id="msg" style="max-width:560px;padding:0 20px;white-space:pre-wrap">Starting...</div>
<button id="skip" style="margin-top:28px;padding:10px 18px;border:0;border-radius:8px;background:#333;color:#ddd;font:inherit">Use the basic editor now</button>
<script>
  var H = { 'X-Vscode-Fs': '1' };
  document.getElementById('skip').onclick = function () { location.replace('/index.html'); };
  async function tick() {
    try {
      var s = await (await fetch('/__fs/boot-status', { headers: H })).json();
      var msg = document.getElementById('msg');
      msg.textContent = s.message || s.phase;
      if (s.phase === 'ready' && s.url) { location.replace(s.url); return; }
      if (s.phase === 'fallback') {
        msg.textContent = (s.message ? s.message + '\n\n' : '') + 'Opening the basic editor...';
        setTimeout(function () { location.replace('/index.html'); }, s.message ? 6000 : 0);
        return;
      }
    } catch (e) { /* server not reachable yet */ }
    setTimeout(tick, 1500);
  }
  tick();
</script>

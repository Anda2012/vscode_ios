[package]
name = "vscode-ios"
version = "0.1.0"
edition = "2021"

[lib]
name = "vscode_ios_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
mime_guess = "2"
percent-encoding = "2"
serde_json = "1"

name: Linux core probe (Ubuntu arm64 on LinuxRunner)

# Answers one question before relying on it in the app: does an Ubuntu 24.04 arm64 userland run on
# LinuxRunner's arm64 interpreter, and how fast? LinuxRunner's core does not compile on Linux hosts
# (it uses Darwin-only socket fields), so:
#   job 1 (arm64 Linux): builds the root filesystem and converts it to LinuxRunner's "fakefs" format
#   job 2 (Apple-silicon macOS): builds the interpreter (same CPU family as an iPad) and runs Ubuntu on it
# Nothing here touches the iOS app.
on:
  workflow_dispatch:

jobs:
  rootfs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Check out LinuxRunner
        uses: actions/checkout@v4
        with:
          repository: mxhm11cr/LinuxRunner
          path: lr

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build clang lld llvm pkg-config \
            libarchive-dev libsqlite3-dev python3 debootstrap ubuntu-keyring zip

      - name: Build fakefsify
        working-directory: lr
        run: |
          CC=clang meson setup build-arm64-linux -Dguest_arch=arm64 --buildtype=release
          ninja -C build-arm64-linux tools/fakefsify

      - name: Make the Ubuntu 24.04 (noble) arm64 root filesystem
        run: |
          sudo debootstrap --arch=arm64 --variant=minbase \
            --include=ca-certificates,curl,bash,coreutils,python3,nano,less,git,openssh-client,procps \
            noble ubuntu-rootfs http://ports.ubuntu.com/ubuntu-ports
          sudo mkdir -p ubuntu-rootfs/root ubuntu-rootfs/mnt/vscode
          printf 'nameserver 1.1.1.1\n' | sudo tee ubuntu-rootfs/etc/resolv.conf >/dev/null
          printf 'vscode\n' | sudo tee ubuntu-rootfs/etc/hostname >/dev/null
          printf 'deb http://ports.ubuntu.com/ubuntu-ports noble main universe\n' | sudo tee ubuntu-rootfs/etc/apt/sources.list >/dev/null
          sudo chroot ubuntu-rootfs /bin/sh -c 'apt-get clean; rm -rf /var/lib/apt/lists/* /var/cache/apt/* /tmp/* /usr/share/doc/* /usr/share/man/* /usr/share/info/*'
          sudo tar --numeric-owner -C ubuntu-rootfs -cf ubuntu.tar .
          lr/build-arm64-linux/tools/fakefsify ubuntu.tar ubuntu-fakefs
          (cd ubuntu-fakefs && zip -qr -X ../ubuntu-fakefs.zip .)
          { echo "rootfs tar: $(du -sh ubuntu.tar | cut -f1)"; echo "fakefs on disk: $(du -sh ubuntu-fakefs | cut -f1)"; echo "fakefs zip: $(du -sh ubuntu-fakefs.zip | cut -f1)"; } | tee sizes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-fakefs
          path: |
            ubuntu-fakefs.zip
            sizes.txt
          retention-days: 7

  run:
    needs: rootfs
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out LinuxRunner
        uses: actions/checkout@v4
        with:
          repository: mxhm11cr/LinuxRunner
          path: lr

      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-fakefs

      - name: Install build tools
        run: brew install meson ninja

      - name: Build the interpreter (ish) on Apple silicon
        working-directory: lr
        run: |
          meson setup build/host -Dengine=asbestos -Dguest_arch=arm64 -Djit=false -Djit_emit=false -Dcli_aot=
          ninja -C build/host ish
          ls -la build/host/ish

      - name: Unpack the root filesystem on a case-sensitive volume
        run: |
          hdiutil create -size 4g -fs "Case-sensitive APFS" -volname ubuntu -type SPARSE "$RUNNER_TEMP/ubuntu"
          hdiutil attach "$RUNNER_TEMP/ubuntu.sparseimage" -mountpoint /Volumes/ubuntu
          mkdir /Volumes/ubuntu/fakefs
          unzip -q ubuntu-fakefs.zip -d /Volumes/ubuntu/fakefs
          ls /Volumes/ubuntu/fakefs

      - name: Run Ubuntu on the interpreter
        run: |
          ISH="$PWD/lr/build/host/ish"
          ROOT=/Volumes/ubuntu/fakefs
          run() { echo; echo "### $1"; shift; s=$(date +%s); gtimeout 900 "$ISH" -f "$ROOT" /bin/bash -c "export PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin; $*" 2>&1 || echo "[FAILED rc=$?]"; echo "[$(( $(date +%s) - s ))s]"; }
          brew install coreutils >/dev/null 2>&1 || true
          {
            echo "# Ubuntu arm64 on LinuxRunner probe (macOS arm64 host, interpreter only)"; cat sizes.txt
            run "os-release"        'cat /etc/os-release | head -4; uname -a'
            run "bash + python"     'bash --version | head -1; python3 --version'
            run "shell loop speed"  'i=0; while [ $i -lt 20000 ]; do i=$((i+1)); done; echo done'
            run "python speed"      "python3 -c 'print(sum(i*i for i in range(2000000)))'"
            run "dns + http"        'getent hosts ports.ubuntu.com; curl -sI http://ports.ubuntu.com/ubuntu-ports/ | head -1'
            run "apt update"        'apt-get update 2>&1 | tail -5'
            run "apt install"       'apt-get install -y --no-install-recommends tree 2>&1 | tail -4; tree --version'
            run "background jobs"   'sleep 1 & wait; echo bg-ok'
          } | tee report.txt
          cat report.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-probe-report
          path: report.txt
